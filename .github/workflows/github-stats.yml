name: GitHub stats

on:
  schedule:
    - cron: "17 4 * * *"  # daily, off the hour to dodge the cron rush
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/github_stats.py", ".github/workflows/github-stats.yml"]

permissions:
  contents: write

concurrency:
  group: github-stats
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/github_stats.py
      - name: Commit if changed
        run: |
          git add assets/stats-*.svg assets/recent-*.svg assets/repo-*.svg README.md
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh GitHub stats"
          git push
